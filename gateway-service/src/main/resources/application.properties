server.port=8888
spring.application.name=gateway-service

spring.cloud.gateway.server.webmvc.routes[0].id=wallet-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://WALLET-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/wallet/**

spring.cloud.gateway.server.webmvc.routes[1].id=shop-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://SHOP-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webmvc.routes[2].id=inventory-products
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[3].id=inventory-categories
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/categories/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true